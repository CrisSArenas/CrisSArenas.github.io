<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:var(--c-page);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
body::before{display:none}
h1{margin:0;font-size:96px;font-weight:600;color:var(--c-text);letter-spacing:-3px}
h1::after{content:'';display:block;width:90px;height:3px;margin:28px auto 0;border-radius:2px;background:var(--c-gold)}
p{margin:26px 0 0;font-size:40px;font-weight:500;color:var(--c-text-2);letter-spacing:-.5px}
</style></head><body>
<h1>Cristian Arenas</h1>
<p>Quantitative Investment Professional and AI Engineer</p>
</body></html>
