<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8">
<!-- Social share image (1200x630), rendered to assets/images/og.png by tools/render-images.mjs. Colours from the shared tokens. -->
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
@font-face{font-family:'OG Inter';src:url('../assets/fonts/inter-var.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'OG Mono';src:url('../assets/fonts/jetbrains-mono-var.woff2') format('woff2');font-weight:100 800}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--c-page);color:var(--c-text);font-family:'OG Inter',sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,color-mix(in srgb,var(--c-text) 5%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--c-text) 5%,transparent) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 75% 85% at 85% 10%,#000 25%,transparent 75%)}
.wrap{position:absolute;inset:0;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:18px}
.mark{width:56px;height:56px;border-radius:14px;border:1.5px solid var(--c-chip-border);background:var(--c-panel);display:grid;place-items:center;font-family:'OG Mono',monospace;font-size:19px;color:var(--c-green);letter-spacing:.02em}
.eyebrow{font-family:'OG Mono',monospace;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-green)}
h1{margin:0;font-size:92px;font-weight:600;letter-spacing:-.04em;line-height:1}
p{margin:26px 0 0;max-width:1040px;font-size:38px;font-weight:500;letter-spacing:-.015em;line-height:1.25;color:var(--c-text-2)}
.rule{width:96px;height:3px;border-radius:2px;background:var(--c-gold);margin-bottom:34px}
.foot{display:flex;justify-content:space-between;align-items:center;font-family:'OG Mono',monospace;font-size:17px;letter-spacing:.08em;color:var(--c-text-3)}
.dots{display:flex;gap:10px}.dots i{display:block;width:9px;height:9px;border-radius:50%;background:var(--c-chip-border)}.dots i:first-child{background:var(--c-green)}.dots i:nth-child(2){background:var(--c-gold)}
</style></head><body>
<div class="grid"></div>
<div class="wrap">
  <div class="top"><div class="mark"><svg viewBox="0 0 32 32" width="34" height="34"><path d="M7.5 23.5C10.5 15 15 11.2 24.5 9" fill="none" stroke="#4FC1B0" stroke-width="2.2" stroke-linecap="round"/><circle cx="16.4" cy="12.6" r="3.1" fill="#C8A66B"/><circle cx="7.5" cy="23.5" r="1.6" fill="#4FC1B0"/></svg></div><div class="eyebrow">Portfolio management and AI engineering</div></div>
  <div><div class="rule"></div><h1>Cristian Arenas</h1><p>Quantitative Investment Management &amp; AI Engineering</p></div>
  <div class="foot"><span>crissarenas.github.io</span><span class="dots"><i></i><i></i><i></i></span></div>
</div>
</body></html>
